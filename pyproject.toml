[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reqs"
version = "0.1.0"
description = "Requirements prioritization and traceability decision-support system"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "jinja2>=3.1,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "numpy>=2.0,<3.0",
  "reportlab>=4.0,<5.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1.0", "pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
