services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reqs
      POSTGRES_USER: reqs
      POSTGRES_PASSWORD: reqs
    ports:
      - "5432:5432"
    volumes:
      - reqs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reqs -d reqs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reqs_postgres_data:
