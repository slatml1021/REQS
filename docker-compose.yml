services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: reqs
      MYSQL_USER: reqs
      MYSQL_PASSWORD: reqs
      MYSQL_ROOT_PASSWORD: reqs_root
    ports:
      - "3307:3306"
    volumes:
      - reqs_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -preqs_root"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reqs_mysql_data:
