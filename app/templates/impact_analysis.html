<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQS | Etki Analizi</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f7fb}.shell{max-width:960px}.brand{letter-spacing:.1em;font-weight:800}.card{border:0;border-radius:16px}.impact{border-left:4px solid #e59f23}.forward{border-left-color:#167a6c}.backward{border-left-color:#b35050}</style></head><body><main class="shell container py-4"><a class="brand text-decoration-none" href="/">REQS</a><h1 class="h2 mt-4">Değişiklik etki analizi</h1><p class="text-secondary">Bir gereksinim değişmeden önce doğrudan ve dolaylı ilişkileri görün.</p><section class="card shadow-sm p-4"><div class="row g-2"><div class="col-md-9"><select id="requirement" class="form-select"></select></div><div class="col-md-3"><button id="analyse" class="btn btn-primary w-100">Etkiyi analiz et</button></div></div><div id="status" class="small mt-3" role="status"></div><div id="results" class="row g-3 mt-1"></div></section></main><script>const direction={forward:'İleri etki',backward:'Geri etki'};fetch('/api/v1/requirements').then(r=>r.json()).then(items=>document.querySelector('#requirement').innerHTML=items.map(x=>`<option value="${x.key}">${x.key} - ${x.title}</option>`).join(''));document.querySelector('#analyse').onclick=async()=>{const key=document.querySelector('#requirement').value,status=document.querySelector('#status'),results=document.querySelector('#results');if(!key)return;status.textContent='Analiz ediliyor…';results.innerHTML='';const response=await fetch('/api/v1/impact-analysis/'+encodeURIComponent(key));if(!response.ok){status.textContent='Analiz yapılamadı.';return}const data=await response.json();status.textContent=data.affected_requirements.length?`${data.affected_requirements.length} etkilenen gereksinim bulundu.`:'Etkilenen başka gereksinim bulunmadı.';results.innerHTML=data.affected_requirements.map(item=>`<div class="col-md-6"><div class="impact ${item.direction} card p-3 shadow-sm"><div class="small text-secondary">${direction[item.direction]} · ${item.distance}. seviye</div><strong>${item.key}</strong><span>${item.title}</span><div class="small mt-2 text-secondary">İlişki yolu: ${item.relation_path.join(' → ')}</div></div></div>`).join('')}</script></body></html>
