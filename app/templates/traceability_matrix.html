<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQS | İzlenebilirlik</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/static/app.css" rel="stylesheet"><style>.matrix td{min-width:120px;font-size:.78rem}.matrix th{min-width:120px;background:#edf3fa}.linked{background:#d9f1ec;color:#145b53;font-weight:600}.sticky{position:sticky;left:0;z-index:1}</style></head>
<body><main class="container app-shell py-4"><nav class="d-flex justify-content-between align-items-center mb-4"><a class="brand text-decoration-none" href="/">REQS</a><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-primary" href="/traceability/graph">Ağ görünümü</a><a class="btn btn-sm btn-outline-primary" href="/impact-analysis">Etki analizi</a></div></nav><h1 class="h2">İzlenebilirlik matrisi ve ilişkiler</h1><p class="text-secondary">Yönlü ilişkiler kaynak-hedef yönünde; yönsüz ilişkiler iki hücrede birden görünür.</p>
<section class="card border-0 shadow-sm p-4 mb-4"><form id="relation-form" class="row g-3 align-items-end"><input type="hidden" name="id"><div class="col-md-3"><label class="form-label">Kaynak</label><select class="form-select" name="source_requirement_id" required></select></div><div class="col-md-3"><label class="form-label">İlişki türü</label><select class="form-select" name="relation_type"><option value="depends_on">Bağımlılık</option><option value="prerequisite_of">Ön koşul</option><option value="similar_to">Benzerlik</option><option value="refines">Üst-alt / detaylandırma</option><option value="conflicts_with">Çakışma / çelişki</option><option value="related_to">Genel ilişki</option></select></div><div class="col-md-3"><label class="form-label">Hedef</label><select class="form-select" name="target_requirement_id" required></select></div><div class="col-md-2"><div class="form-check mt-4"><input class="form-check-input" type="checkbox" name="is_directional" checked><label class="form-check-label">Yönlü ilişki</label></div></div><div class="col-md-1"><button class="btn btn-primary w-100">Kaydet</button></div></form><p id="relation-status" class="small mt-3 mb-0" role="status"></p></section>
<section class="card border-0 shadow-sm mb-4"><div class="card-body p-0"><div class="p-4 border-bottom"><h2 class="h5 mb-0">Tanımlı ilişkiler</h2></div><div class="table-responsive"><table class="table align-middle mb-0"><thead class="table-light"><tr><th>Kaynak</th><th>Tür</th><th>Hedef</th><th>Yön</th><th class="text-end">İşlem</th></tr></thead><tbody id="relations-body"></tbody></table></div></div></section>
<section class="card border-0 shadow-sm p-3"><div class="table-responsive"><table class="table table-bordered matrix mb-0"><thead id="matrix-head"></thead><tbody id="matrix-body"></tbody></table></div></section></main>
<script>let requirements=[],relations=[];const labels={depends_on:'bağımlılık',prerequisite_of:'ön koşul',similar_to:'benzer',refines:'üst-alt',conflicts_with:'çelişki',related_to:'ilişkili'};const form=document.querySelector('#relation-form'),status=document.querySelector('#relation-status');const setStatus=(text,ok=true)=>{status.className='small mt-3 mb-0 '+(ok?'text-success':'text-danger');status.textContent=text};function reset(){form.reset();form.elements.id.value='';form.elements.source_requirement_id.disabled=false;form.elements.target_requirement_id.disabled=false}async function load(){const [reqs,relData,matrix]=await Promise.all([fetch('/api/v1/requirements').then(r=>r.json()),fetch('/api/v1/relations').then(r=>r.json()),fetch('/api/v1/traceability/matrix').then(r=>r.json())]);requirements=reqs;relations=relData;const options=requirements.map(x=>`<option value="${x.id}">${x.key} - ${x.title}</option>`).join('');form.elements.source_requirement_id.innerHTML=options;form.elements.target_requirement_id.innerHTML=options;document.querySelector('#matrix-head').innerHTML='<tr><th class="sticky">Kaynak / Hedef</th>'+matrix.requirements.map(key=>`<th>${key}</th>`).join('')+'</tr>';document.querySelector('#matrix-body').innerHTML=matrix.requirements.map(source=>'<tr><th class="sticky">'+source+'</th>'+matrix.requirements.map(target=>{const items=matrix.matrix[source][target];return `<td class="${items.length?'linked':''}">${items.map(x=>labels[x]).join('<br>')}</td>`}).join('')+'</tr>').join('');const index=Object.fromEntries(requirements.map(x=>[x.id,x]));const body=document.querySelector('#relations-body');body.innerHTML='';relations.forEach(item=>{const row=document.createElement('tr');row.innerHTML=`<td></td><td></td><td></td><td></td><td class="text-end"><button class="btn btn-sm btn-outline-primary edit">Düzenle</button> <button class="btn btn-sm btn-outline-danger remove">Sil</button></td>`;row.children[0].textContent=index[item.source_requirement_id]?.key||item.source_requirement_id;row.children[1].textContent=labels[item.relation_type];row.children[2].textContent=index[item.target_requirement_id]?.key||item.target_requirement_id;row.children[3].textContent=item.is_directional?'Yönlü':'Yönsüz';row.querySelector('.edit').onclick=()=>{form.elements.id.value=item.id;form.elements.source_requirement_id.value=item.source_requirement_id;form.elements.target_requirement_id.value=item.target_requirement_id;form.elements.relation_type.value=item.relation_type;form.elements.is_directional.checked=item.is_directional;form.elements.source_requirement_id.disabled=true;form.elements.target_requirement_id.disabled=true;form.scrollIntoView({behavior:'smooth',block:'center'})};row.querySelector('.remove').onclick=async()=>{if(!confirm('İlişki silinsin mi?'))return;const response=await fetch('/api/v1/relations/'+item.id,{method:'DELETE'});if(response.ok){setStatus('İlişki silindi.');load()}else setStatus('İlişki silinemedi.',false)};body.appendChild(row)})}form.addEventListener('submit',async e=>{e.preventDefault();const id=form.elements.id.value;const payload={relation_type:form.elements.relation_type.value,is_directional:form.elements.is_directional.checked};if(!id){payload.source_requirement_id=Number(form.elements.source_requirement_id.value);payload.target_requirement_id=Number(form.elements.target_requirement_id.value)}const response=await fetch(id?'/api/v1/relations/'+id:'/api/v1/relations',{method:id?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json();if(response.ok){setStatus(id?'İlişki güncellendi.':'İlişki eklendi.');reset();load()}else setStatus(data.detail||'İlişki kaydedilemedi.',false)});load().catch(()=>setStatus('Veriler yüklenemedi.',false));</script></body></html>
