<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQS | İzlenebilirlik Matrisi</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f7fb}.shell{max-width:1120px}.brand{letter-spacing:.1em;font-weight:800}.card{border:0;border-radius:16px}.matrix td{min-width:105px;font-size:.78rem}.matrix th{min-width:105px;background:#edf3fa}.linked{background:#d9f1ec;color:#145b53;font-weight:600}.sticky{position:sticky;left:0}</style></head><body><main class="shell container py-4"><div class="d-flex justify-content-between"><a class="brand text-decoration-none" href="/">REQS</a><div><a class="btn btn-sm btn-outline-primary" href="/traceability/graph">Ağ görünümü</a> <a class="btn btn-sm btn-outline-primary" href="/impact-analysis">Etki analizi</a></div></div><h1 class="h2 mt-4">İzlenebilirlik matrisi</h1><p class="text-secondary">İlişkiyi tanımla; matris ve ağ görünümü anında güncellensin.</p><section class="card shadow-sm p-4 mb-4"><form id="relation-form" class="row g-2 align-items-end"><div class="col-md-4"><label class="form-label small">Kaynak gereksinim</label><select class="form-select" name="source_requirement_id" required></select></div><div class="col-md-3"><label class="form-label small">İlişki</label><select class="form-select" name="relation_type"><option value="depends_on">bağlıdır</option><option value="prerequisite_of">ön koşuludur</option><option value="refines">detaylandırır</option><option value="related_to">ilişkilidir</option></select></div><div class="col-md-4"><label class="form-label small">Hedef gereksinim</label><select class="form-select" name="target_requirement_id" required></select></div><div class="col-md-1"><button class="btn btn-primary w-100">Ekle</button></div></form><div id="relation-status" class="small mt-2" role="status"></div></section><section class="card shadow-sm p-3"><div class="table-responsive"><table class="table table-bordered matrix mb-0"><thead id="matrix-head"></thead><tbody id="matrix-body"></tbody></table></div></section></main><script>let requirements=[];const label={depends_on:'bağlıdır',prerequisite_of:'ön koşuludur',refines:'detaylandırır',related_to:'ilişkilidir'};async function load(){[requirements,matrix]=await Promise.all([fetch('/api/v1/requirements').then(r=>r.json()),fetch('/api/v1/traceability/matrix').then(r=>r.json())]);const options=requirements.map(x=>`<option value="${x.id}">${x.key} - ${x.title}</option>`).join('');document.querySelectorAll('select[name$="requirement_id"]').forEach(select=>select.innerHTML=options);document.querySelector('#matrix-head').innerHTML='<tr><th class="sticky">Kaynak / Hedef</th>'+matrix.requirements.map(key=>`<th>${key}</th>`).join('')+'</tr>';document.querySelector('#matrix-body').innerHTML=matrix.requirements.map(source=>'<tr><th class="sticky">'+source+'</th>'+matrix.requirements.map(target=>{const relations=matrix.matrix[source][target];return `<td class="${relations.length?'linked':''}">${relations.map(x=>label[x]).join('<br>')}</td>`}).join('')+'</tr>').join('')}load();document.querySelector('#relation-form').addEventListener('submit',async e=>{e.preventDefault();const response=await fetch('/api/v1/relations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const status=document.querySelector('#relation-status');status.className='small mt-2 '+(response.ok?'text-success':'text-danger');status.textContent=response.ok?'İlişki eklendi.':((await response.json()).detail||'İlişki eklenemedi.');if(response.ok)load()})</script></body></html>
