<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>REQS | İzlenebilirlik Ağı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background: #f6f8fb; }
      .app-shell { max-width: 1040px; }
      .brand { color: #194185; font-weight: 700; letter-spacing: .04em; }
      #traceability-graph { width: 100%; height: 520px; background: #fff; border: 1px solid #dfe5ef; border-radius: .75rem; }
    </style>
  </head>
  <body>
    <main class="app-shell container py-5">
      <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
          <p class="brand mb-1">REQS</p>
          <h1 class="h2 mb-1">İzlenebilirlik ilişki ağı</h1>
          <p class="text-secondary mb-0">Gereksinimler arasındaki yönlü ilişkileri tek ekranda incele.</p>
        </div>
        <span class="badge text-bg-light border">İzlenebilirlik</span>
      </div>
      <section class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <div id="graph-status" class="text-secondary small mb-3" role="status" aria-live="polite">İlişkiler yükleniyor…</div>
          <div id="traceability-graph" role="img" aria-label="Gereksinim izlenebilirlik ilişki ağı"></div>
        </div>
      </section>
      <section class="mt-4 card border-0">
        <div class="card-body p-4 small text-secondary">
          <strong>Okuma notu:</strong> Ok yönü kaynak gereksinimden hedef gereksinime gider. Ok üzerindeki etiket ilişki türünü gösterir.
        </div>
      </section>
    </main>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script>
      const container = document.getElementById("traceability-graph");
      const status = document.getElementById("graph-status");
      const highlightedKey = new URLSearchParams(window.location.search).get("highlight");
      const relationLabel = (value) => ({
        depends_on: "bağlıdır", prerequisite_of: "ön koşuludur", refines: "detaylandırır", related_to: "ilişkilidir",
      }[value] || value);
      fetch("/api/v1/traceability/matrix")
        .then((response) => response.ok ? response.json() : Promise.reject())
        .then((data) => {
          const keys = data.requirements;
          if (!keys.length) {
            status.textContent = "Görselleştirmek için önce gereksinim ekle.";
            return;
          }
          const edges = [];
          keys.forEach((source) => keys.forEach((target) => {
            const relations = data.matrix[source][target];
            if (relations.length) edges.push({ from: source, to: target, label: relations.map(relationLabel).join(", "), arrows: "to" });
          }));
          const nodes = new vis.DataSet(keys.map(key => ({ id: key, label: key, color: key === highlightedKey ? "#ffd56a" : "#e7f0ff" })));
          new vis.Network(container, { nodes, edges: new vis.DataSet(edges) }, { physics: { stabilization: true }, interaction: { hover: true }, nodes: { shape: "box", margin: 12, font: { color: "#102a56", face: "system-ui" }, borderWidth: 1.5 }, edges: { color: "#637083", font: { align: "middle", size: 11 }, smooth: { type: "dynamic" } } });
          status.textContent = `${keys.length} gereksinim ve ${edges.length} yönlü ilişki gösteriliyor.`;
        })
        .catch(() => { status.textContent = "İlişki verisi yüklenemedi; bağlantıyı kontrol edip tekrar dene."; });
    </script>
  </body>
</html>
