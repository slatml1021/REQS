<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQS | Wiegers Puanlama</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f7fb}.shell{max-width:1080px}.brand{letter-spacing:.1em;font-weight:800}.card{border:0;border-radius:16px}input[type=number]{min-width:72px}</style></head><body><main class="shell container py-4"><a class="brand text-decoration-none" href="/">REQS</a><div class="d-flex justify-content-between align-items-end mt-4 mb-3"><div><h1 class="h2 mb-1">Wiegers göreceli ağırlıklandırma</h1><p class="text-secondary mb-0">Puanlar 1-9 aralığındadır. Öncelik: (fayda + ceza) / (maliyet + risk).</p></div><a href="/prioritization/dashboard" class="btn btn-outline-primary">Sonuçlar</a></div><section class="card shadow-sm p-4"><form id="wiegers-form"><h2 class="h6">Proje ağırlıkları</h2><div class="row g-2 mb-4" id="weight-fields"></div><h2 class="h6">Gereksinim değerlendirmeleri</h2><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Gereksinim</th><th>Fayda</th><th>Ceza</th><th>Maliyet</th><th>Risk</th></tr></thead><tbody id="assessments"></tbody></table></div><button class="btn btn-primary">Hesapla ve kaydet</button><div id="status" class="small mt-3" role="status"></div></form></section></main><script>const fields=['benefit','penalty','cost','risk'], labels={benefit:'Fayda',penalty:'Ceza',cost:'Maliyet',risk:'Risk'};const number=(name,value=1)=>`<input class="form-control" type="number" min="1" max="9" value="${value}" required name="${name}">`;fields.forEach(key=>document.querySelector('#weight-fields').insertAdjacentHTML('beforeend',`<div class="col-6 col-md-3"><label class="small form-label">${labels[key]} ağırlığı</label>${number('weight-'+key)}</div>`));fetch('/api/v1/requirements').then(r=>r.json()).then(items=>{document.querySelector('#assessments').innerHTML=items.map(item=>`<tr data-id="${item.id}"><td><strong>${item.key}</strong><br><span class="small text-secondary"></span></td>${fields.map(key=>`<td>${number(key+'-'+item.id,5)}</td>`).join('')}</tr>`).join('');items.forEach((item,index)=>document.querySelectorAll('#assessments .text-secondary')[index].textContent=item.title)});document.querySelector('#wiegers-form').addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(e.target),weights=Object.fromEntries(fields.map(key=>[key,Number(data.get('weight-'+key))]));const assessments=[...document.querySelectorAll('#assessments tr')].map(row=>({requirement_id:Number(row.dataset.id),...Object.fromEntries(fields.map(key=>[key,Number(data.get(key+'-'+row.dataset.id))]))}));const response=await fetch('/api/v1/wiegers/scores',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({weights,assessments})});const status=document.querySelector('#status');status.className='small mt-3 '+(response.ok?'text-success':'text-danger');status.textContent=response.ok?'Puanlar kaydedildi. Sonuç ekranından karşılaştırabilirsin.':((await response.json()).detail||'Hesaplama yapılamadı.')})</script></body></html>
