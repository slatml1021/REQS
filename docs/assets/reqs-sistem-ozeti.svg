<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">REQS karar destek sistemi özeti</title>
  <desc id="desc">Gereksinim girişlerinden AHP, Wiegers ve Volere önceliklendirmesine, izlenebilirlik ve etki analizinden PDF rapora uzanan sistem akışı.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b35"/><stop offset="1" stop-color="#0f2c50"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#031021" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8ec5ff"/></marker>
    <style>
      .title{font:700 38px Arial,sans-serif;fill:#f8fbff}.subtitle{font:400 18px Arial,sans-serif;fill:#b9d5f4}.label{font:700 19px Arial,sans-serif;fill:#113256}.body{font:400 15px Arial,sans-serif;fill:#3d5976}.small{font:600 14px Arial,sans-serif;fill:#d7eaff}.arrow{stroke:#8ec5ff;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="760" fill="url(#bg)"/>
  <circle cx="1260" cy="92" r="190" fill="#2574ba" opacity=".12"/><circle cx="94" cy="700" r="230" fill="#1fd3ae" opacity=".09"/>
  <text class="title" x="70" y="76">REQS · Karar Destek Sistemi</text>
  <text class="subtitle" x="70" y="108">Gereksinim önceliklendirme, izlenebilirlik, etki analizi ve raporlama</text>

  <g filter="url(#shadow)"><rect x="70" y="190" width="250" height="300" rx="22" fill="#e9f4ff"/><rect x="70" y="190" width="250" height="62" rx="22" fill="#55a6ec"/><rect x="70" y="230" width="250" height="22" fill="#55a6ec"/>
    <text class="label" x="101" y="229">1 · Gereksinimler</text><text class="body" x="101" y="294">• Benzersiz anahtar</text><text class="body" x="101" y="329">• Tür ve durum</text><text class="body" x="101" y="364">• Açıklama ve ilişki</text><text class="body" x="101" y="414">PostgreSQL · SQLAlchemy</text><text class="body" x="101" y="445">Alembic migration</text></g>

  <path class="arrow" d="M335 340 C365 340 375 340 405 340"/>
  <g filter="url(#shadow)"><rect x="420" y="155" width="500" height="370" rx="22" fill="#f5efff"/><rect x="420" y="155" width="500" height="62" rx="22" fill="#9570d7"/><rect x="420" y="195" width="500" height="22" fill="#9570d7"/>
    <text class="label" x="451" y="194">2 · Önceliklendirme motoru</text>
    <rect x="454" y="254" width="126" height="198" rx="14" fill="#fff"/><text class="label" x="486" y="292">AHP</text><text class="body" x="472" y="328">İkili</text><text class="body" x="467" y="351">karşılaştırma</text><text class="body" x="476" y="397">NumPy</text>
    <rect x="607" y="254" width="126" height="198" rx="14" fill="#fff"/><text class="label" x="626" y="292">Wiegers</text><text class="body" x="627" y="328">Fayda</text><text class="body" x="627" y="351">Ceza</text><text class="body" x="627" y="374">Maliyet</text><text class="body" x="627" y="397">Risk</text>
    <rect x="760" y="254" width="126" height="198" rx="14" fill="#fff"/><text class="label" x="782" y="292">Volere</text><text class="body" x="780" y="328">En çok</text><text class="body" x="780" y="351">4 kriter</text><text class="body" x="775" y="397">0-10 puan</text>
    <text class="body" x="527" y="489">Ortak normalize sonuçlar · 0-100</text></g>

  <path class="arrow" d="M935 280 C965 280 975 280 1005 280"/>
  <g filter="url(#shadow)"><rect x="1020" y="155" width="310" height="250" rx="22" fill="#e9fff8"/><rect x="1020" y="155" width="310" height="62" rx="22" fill="#24bd9a"/><rect x="1020" y="195" width="310" height="22" fill="#24bd9a"/>
    <text class="label" x="1051" y="194">3 · Görselleştirme</text><text class="body" x="1051" y="264">Chart.js sonuç grafikleri</text><text class="body" x="1051" y="302">Jinja2 + Bootstrap arayüzü</text><text class="body" x="1051" y="340">PDF rapor çıktısı</text></g>

  <path class="arrow" d="M335 520 C445 650 785 650 1005 510"/>
  <g filter="url(#shadow)"><rect x="665" y="555" width="350" height="145" rx="22" fill="#fff5e8"/><rect x="665" y="555" width="350" height="58" rx="22" fill="#efad53"/><rect x="665" y="591" width="350" height="22" fill="#efad53"/>
    <text class="label" x="696" y="593">İzlenebilirlik ve etki</text><text class="body" x="696" y="647">NetworkX · matris · vis-network</text><text class="body" x="696" y="678">Yönlü/yönsüz ilişki ve etki yolu</text></g>
  <path class="arrow" d="M1025 625 C1090 625 1120 525 1135 430"/>

  <text class="small" x="70" y="680">FastAPI REST API</text><text class="small" x="70" y="710">PostgreSQL ana profil · MySQL uyumluluk profili · pytest doğrulaması</text>
</svg>
